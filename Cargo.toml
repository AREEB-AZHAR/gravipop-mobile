[package]
name = "gravipop-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Areeb Azhar"]
description = "GraviPop: Celestial Merge - High-performance mobile orbital physics merge game in Rust"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quad-rand = "0.2"

[lib]
name = "gravipop_mobile"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gravipop-mobile"
path = "src/main.rs"

[package.metadata.android]
assets = "assets"
android_version = 34
target_sdk_version = 34
min_sdk_version = 24

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
