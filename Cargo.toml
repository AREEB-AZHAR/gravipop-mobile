[package]
name = "gravipop-mobile"
version = "0.1.0"
edition = "2021"
authors = ["Areeb Azhar"]
description = "GraviPop: Celestial Merge - High-performance mobile orbital physics merge game in Rust"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quad-rand = "0.2"

[lib]
name = "gravipop_mobile"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "gravipop-mobile"
path = "src/main.rs"

[package.metadata.android]
package = "com.gravipop.celestialmerge"
label = "GraviPop"
version_code = 1
version_name = "0.1.0"
assets = "assets"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
